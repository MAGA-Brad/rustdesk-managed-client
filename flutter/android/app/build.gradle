import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id "com.google.protobuf" version "0.10.1"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Managed builds (RDC): the app identity comes from the build environment, like the managed
// values compiled into the Rust library; unset, this is the stock RustDesk app.
def managedApplicationId = System.getenv('RDC_ANDROID_APPLICATION_ID')
def isManagedAndroid = managedApplicationId != null && !managedApplicationId.trim().isEmpty()

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.36.2'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace "com.carriez.flutter_hbb"
    compileSdkVersion 36
    // The NDK the Rust library is built with, so Gradle doesn't fetch another.
    ndkVersion "28.2.13676358"
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId isManagedAndroid ? managedApplicationId.trim() : "com.carriez.flutter_hbb"
        manifestPlaceholders = [
            appLabel: isManagedAndroid ? (System.getenv('RDC_ANDROID_APP_LABEL') ?: 'RDC') : 'RustDesk',
            deepLinkScheme: isManagedAndroid ? (System.getenv('RDC_ANDROID_DEEP_LINK_SCHEME') ?: 'rdc') : 'rustdesk',
        ]
        // Managed: the Rust library imports getrandom@LIBC_P (Android 9) without a fallback.
        minSdkVersion isManagedAndroid ? 28 : 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // The keystore passwords come from the build environment when set (RDC_ANDROID_KEY_PASSWORD /
    // RDC_ANDROID_STORE_PASSWORD), so key.properties needs only keyAlias and storeFile.
    signingConfigs {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword System.getenv('RDC_ANDROID_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
        storePassword System.getenv('RDC_ANDROID_STORE_PASSWORD') ?: keystoreProperties['storePassword']
      }
    }

    // Managed builds only connect out: the overlay drops boot start, the accessibility (input)
    // service, the floating window and Android backup of the app's data (which holds its secrets).
    if (isManagedAndroid) {
        sourceSets.release.manifest.srcFile 'src/managed/AndroidManifest.xml'
        sourceSets.release.res.srcDirs += 'src/managed/res'
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
