def legacyPluginNamespaces = [
    external_path: 'com.pinciat.external_path',
    flutter_keyboard_visibility: 'com.jrai.flutter_keyboard_visibility',
    qr_code_scanner: 'net.touchcapture.qr.flutterqr',
    sqflite: 'com.tekartik.sqflite',
    uni_links: 'name.avioli.unilinks',
]

def java8JvmTarget = JavaVersion.VERSION_1_8.toString()
def java8KotlinJvmTargets = [
    app: java8JvmTarget,
    external_path: java8JvmTarget,
    qr_code_scanner: java8JvmTarget,
]

def configureKotlinJvmTarget = { Project project, String kotlinJvmTarget ->
    project.plugins.withId('kotlin-android') {
        // The root build has no Kotlin plugin on its classpath, so reach JvmTarget through the task's own loader.
        project.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach { task ->
            def jvmTargetClass = task.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')
            task.compilerOptions.jvmTarget.set(jvmTargetClass.fromTarget(kotlinJvmTarget))
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.getActivity' }
        }
    }
}

rootProject.layout.buildDirectory.set(rootProject.file('../build'))
subprojects {
    project.layout.buildDirectory.set(rootProject.file("../build/${project.name}"))
    def legacyNamespace = legacyPluginNamespaces[project.name]
    if (legacyNamespace != null) {
        project.plugins.withId('com.android.library') {
            project.android.namespace = legacyNamespace
        }
    }
    def kotlinJvmTarget = java8KotlinJvmTargets[project.name]
    if (kotlinJvmTarget != null) {
        configureKotlinJvmTarget(project, kotlinJvmTarget)
    }
    // Plugins compile against the app's SDK: sqflite_android 2.4.4 calls Android 16 (API 36) APIs
    // but declares compileSdk 34. Registered before the plugin's own script runs, so this lands
    // before the Android plugin finalizes its settings.
    if (!project.state.executed) {
        project.afterEvaluate {
            if (project.plugins.hasPlugin('com.android.library')) {
                project.android.compileSdk = 36
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
